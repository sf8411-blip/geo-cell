name: Phase 1H Gate C held-out falsification
on:
  push:
    branches: ["phase1h/gate-c-heldout-falsification"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-c:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run Gate C focused tests
        run: python -m unittest discover -s tests -p 'test_gate_c_benchmark.py' -v
      - name: Run Gate B and Gate C focused tests
        run: |
          python -m unittest discover -s tests -p 'test_operator_discovery.py' -v
          python -m unittest discover -s tests -p 'test_gate_c_benchmark.py' -v
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Produce machine-readable benchmark report
        run: |
          python -c "import json; from evo_geo.gate_c_benchmark import run_seed_sweep; json.dump(run_seed_sweep(), open('gate-c-report.json', 'w', encoding='utf-8'), indent=2, sort_keys=True)"
      - name: Upload Gate C report
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-report-python-${{ matrix.python-version }}
          path: gate-c-report.json
          if-no-files-found: error
