name: Phase 1B evidence evaluation lab
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Run evidence evaluation scale sweep
        run: python -m evo_geo.evidence_lab > evidence-lab-results.json
      - name: Validate metrics and recovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("evidence-lab-results.json").read_text(encoding="utf-8"))
          if [row["cell_count"] for row in rows] != [2, 4, 8, 16]:
              raise SystemExit("unexpected scale sweep")
          for row in rows:
              if not row["recovery_complete"] or row["pending_messages"]:
                  raise SystemExit(f"recovery failed at scale {row['cell_count']}")
              before = row["initial"]["accepted_false"]
              after = row["after_counterexamples_and_rejoin"]["accepted_false"]
              if after >= before:
                  raise SystemExit(f"counterexamples did not reduce false acceptance at scale {row['cell_count']}")
          print("validated evidence scale sweep:", [
              (r["cell_count"], r["initial"]["accepted_false"],
               r["after_counterexamples_and_rejoin"]["accepted_false"])
              for r in rows
          ])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1b-evidence-lab-python-${{ matrix.python-version }}
          path: evidence-lab-results.json
