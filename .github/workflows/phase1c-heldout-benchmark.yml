name: Phase 1C held-out and adversarial benchmark
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Run seeded benchmark
        run: python -m evo_geo.heldout_benchmark > heldout-benchmark-results.json
      - name: Validate report schema and uncertainty bounds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("heldout-benchmark-results.json").read_text(encoding="utf-8"))
          if report["benchmark"] != "phase1c_finite_grammar_heldout_adversarial":
              raise SystemExit("unexpected benchmark identifier")
          if report["trials_per_condition"] != 200:
              raise SystemExit("unexpected trial count")
          if len(report["conditions"]) != 3:
              raise SystemExit("expected clean, 10%, and 25% adversarial conditions")
          for condition in report["conditions"]:
              for metric in ("false_acceptance", "heldout_failure"):
                  rate = condition[f"{metric}_rate"]
                  low, high = condition[f"{metric}_95ci_wilson"]
                  if not 0.0 <= low <= rate <= high <= 1.0:
                      raise SystemExit(f"invalid {metric} interval: {condition}")
          print("validated Phase 1C report:", [
              (r["adversarial_fraction"], r["false_acceptance_rate"],
               r["false_acceptance_95ci_wilson"], r["heldout_failure_rate"])
              for r in report["conditions"]
          ])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1c-heldout-benchmark-python-${{ matrix.python-version }}
          path: heldout-benchmark-results.json
