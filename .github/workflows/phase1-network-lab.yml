name: Phase 1 network protocol lab
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Run network scale sweep
        run: python -m evo_geo.network_lab > network-lab-results.json
      - name: Validate scale sweep artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path("network-lab-results.json").read_text(encoding="utf-8"))
          if [row["cell_count"] for row in results] != [2, 4, 8, 16]:
              raise SystemExit("unexpected scale sweep")
          if not all(row["converged"] and row["state_divergence"] == 0 for row in results):
              raise SystemExit("network simulation did not converge to reference")
          print("validated scale sweep:", [(r["cell_count"], r["converged"], r["state_divergence"]) for r in results])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-network-lab-python-${{ matrix.python-version }}
          path: network-lab-results.json
